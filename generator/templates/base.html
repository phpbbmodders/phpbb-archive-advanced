<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ page_title }} - {{ site_name }}{% endblock %}</title>
<style>
/* ── reset & base ── */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Verdana, Geneva, sans-serif;
  font-size: 13px;
  color: #000;
  background: #ffffef;
}
a { color: #800000; text-decoration: none; }
a:hover { color: #ff0000; }
/* bracket decoration on links */
a::before { content: "{"; opacity: 0.15; }
a::after  { content: "}"; opacity: 0.15; }
a:hover::before, a:hover::after { opacity: 1; }
/* suppress brackets on bare structural links */
a.no-bracket::before, a.no-bracket::after,
.postprofile a::before, .postprofile a::after { content: ""; }

h1, h2, h3 { color: #800000; }
hr { border: 0; border-top: 1px solid #ccc; }

/* ── layout ── */
#wrap { max-width: 1024px; margin: 0 auto; background: #ffffef; }

/* ── header ── */
#page-header {
  background: #ede0d7;
  border: 1px solid #D9BFB7;
  padding: 10px 16px;
  margin-bottom: 14px;
}
#page-header h1 { margin: 0; font-size: 1.4em; }
#page-header .site-desc { color: seagreen; font-size: 1em; margin: 2px 0 0; }

/* ── navbar ── */
#page-nav {
  background: darkred;
  color: #fff;
  padding: 4px 12px;
  font-size: 0.9em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
#page-nav a { color: #fff; }
#page-nav a::before, #page-nav a::after { content: ""; }
#page-nav a:hover { color: #ffcccc; }

/* ── breadcrumb ── */
.breadcrumb {
  font-size: 0.9em;
  margin-bottom: 10px;
  padding: 4px 8px;
  background: #ede0d7;
  border: 1px solid #D9BFB7;
}
.breadcrumb a { color: #800000; }

/* ── forum index table ── */
.forabg, .forumbg {
  background: #ede0d7;
  border: 1px solid #D9BFB7;
  margin-bottom: 14px;
}
.forabg .header, .forumbg .header {
  padding: 6px 10px;
  font-weight: bold;
  color: #800000;
  display: flex;
  gap: 8px;
}
.forabg .header a { color: #800000; }
ul.topiclist { list-style: none; margin: 0; padding: 0; }
ul.topiclist.forums { background: #fff; }
ul.topiclist li.row {
  border-top: 1px solid #800000;
  padding: 6px 10px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
ul.topiclist li.row:first-child { border-top: none; }
ul.topiclist li.row .forum-title { font-weight: bold; flex: 1; }
ul.topiclist li.row .forum-title a { color: #800000; }
ul.topiclist li.row .forum-desc { font-size: 0.85em; color: #555; }
ul.topiclist li.row .col-count { min-width: 60px; text-align: right; color: #555; font-size: 0.9em; }
ul.topiclist li.row .col-lastpost { min-width: 180px; max-width: 180px; font-size: 0.85em; color: #555; }

/* ── topic list (forum.html) ── */
table.topic-table { width: 100%; border-collapse: collapse; }
table.topic-table th {
  background: #ede0d7;
  color: #800000;
  padding: 5px 8px;
  text-align: left;
  border-bottom: 1px solid #D9BFB7;
}
table.topic-table td { padding: 5px 8px; border-top: 1px solid #800000; vertical-align: top; }
table.topic-table tr:first-child td { border-top: none; }
table.topic-table td.subject a { color: #800000; font-weight: bold; }
table.topic-table td.count { text-align: right; font-size: 0.9em; color: #555; }
table.topic-table td.lastpost { font-size: 0.85em; color: #555; }

/* ── post layout ── */
.post-wrap {
  display: flex;
  border: 1px solid #D9BFB7;
  margin-bottom: 10px;
  background: #fff;
}
.postprofile {
  min-width: 130px;
  max-width: 155px;
  width: 155px;
  padding: 8px;
  border-right: 1px solid darkred;
  color: #666;
  font-size: 0.85em;
  flex-shrink: 0;
}
.postprofile strong { color: #000; display: block; margin-bottom: 4px; font-size: 1.05em; }
.postprofile .user-avatar img { max-width: 90px; max-height: 90px; display: block; margin: 4px auto 6px; }
.postprofile .rank-img img { max-width: 80px; display: block; margin: 2px 0; }
.postbody { padding: 8px 12px; vertical-align: top; flex: 1; min-width: 0; }
.post-date { font-size: 0.85em; color: #666; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
.content { color: #333; max-width: 80ch; }
.sig {
  border-top: 1px solid #ccc;
  margin-top: 10px;
  padding-top: 6px;
  font-size: 0.85em;
  color: #555;
}

/* ── bbcode elements ── */
blockquote {
  background: #00cccc;
  border-left: 4px solid #800000;
  margin: 8px 0 8px 16px;
  padding: 6px 10px;
}
blockquote blockquote { background: #00eeee; }
blockquote .quote-header { font-weight: bold; font-size: 0.9em; color: #333; margin-bottom: 4px; }

.codebox {
  background: #88ff88;
  border: 1px solid #008800;
  margin: 8px 0;
  padding: 0;
}
.codebox pre {
  margin: 0;
  padding: 8px;
  overflow-x: auto;
  font-size: 0.9em;
  color: #005500;
}

.inline-attachment { margin: 8px 0; }
.inline-attachment img { max-width: 100%; }
.attachment-missing { color: #c00; font-style: italic; }

details.spoiler summary { cursor: pointer; color: #800000; }

/* ── footer ── */
#page-footer {
  text-align: center;
  font-size: 0.85em;
  color: #555;
  margin-top: 20px;
  padding: 10px;
  border-top: 1px solid #D9BFB7;
  background: #ede0d7;
}
#page-footer a { color: #800000; }
</style>
</head>
<body>
<div id="wrap">

<div id="page-header">
  <h1><a class="no-bracket" href="{{ root }}index.html">{{ site_name }}</a></h1>
  <p class="site-desc">Static archive</p>
</div>

<div id="page-nav">
  <a href="{{ root }}index.html">? Board index</a>
</div>

<div id="page-body">
<div class="breadcrumb">
  <a href="{{ root }}index.html">Board index</a>{% block breadcrumb %}{% endblock %}
</div>
{% block content %}{% endblock %}
</div>

<div id="page-footer">
  {{ site_name }} — static archive &nbsp;·&nbsp; {% block footer_note %}{% endblock %}
</div>

</div>
</body>
</html>
